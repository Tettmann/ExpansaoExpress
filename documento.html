  <div class="container">
    <form action="https://expansaoexpress.com.br/FORMULARIO2/FORM2.php" method="POST" enctype="multipart/form-data">

        <h2>Fale conosco!</h2>

      <input type="text" name="nome" placeholder="Nome" required>
      <input type="text" name="telefone" placeholder="Telefone" required>
      <input type="email" name="email" placeholder="E-mail" required>
      <select name="assunto" required>

        <option value="Reclamação">Reclamação</option>
        <option value="Dúvidas">Dúvidas</option>

      </select>

      <div class="file-wrapper">
        <label for="curriculo" class="custom-file-btn">Selecionar um anexo</label>
        <input type="file" id="curriculo" name="curriculo" accept=".doc,.pdf,.png">
      </div>
      <p id="file-name">Formatos aceitos: .doc, .pdf ou .png</p><br>

      <label>
        <input type="checkbox" name="lgpd" required>
        Aceito a <a href="https://expansaoexpress.com.br/FORMULARIO2/LGPD.html" target="_blank" rel="noopener">Politica de Privacidade</a>
